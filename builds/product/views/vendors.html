<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Steel Yard Ledger — vendor management." />
    <title>Vendors — Steel Yard Ledger</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      #app { max-width: 1100px; margin: 0 auto; padding: 0 1rem 2rem; }
      .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .page-head h1 { margin: 0; font-size: 2rem; }
      .section { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; padding: 1rem 1.25rem; margin-top: 1.25rem; }
      .section-heading { display: flex; align-items: baseline; gap: 0.75rem; }
      .section-subtitle { color: #555; font-size: 0.85rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid rgba(0,0,0,0.06); }
      th { color: #555; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
      .muted { color: #777; }
      .empty { color: #777; font-style: italic; padding: 0.75rem 0; }
      .vendor-card { border: 1px solid rgba(0,0,0,0.08); border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 0.5rem; background: #fafafa; }
      .vendor-card.selected { border-color: #ffc400; background: #fffbe8; }
      .vendor-head { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
      .vendor-name { font-weight: 600; }
      .score-stars { color: #ff8a00; }
      .items-table td:first-child { font-weight: 500; }
    </style>
  </head>
  <body class="requires-session">
    <header class="site-header">
      <div class="session-bar">
        <span class="session-user"><span class="session-dot" aria-hidden="true"></span><span id="user-label">Signed in</span></span>
        <span class="session-actions">
          <a class="session-link" href="/catalogue">Materials</a>
          <a class="session-link" href="/customers">Customers</a>
          <a class="session-link" href="/analytics">Analytics</a>
          <a class="session-link" href="/vendors">Vendors</a>
          <a class="session-link" href="/bulk">Bulk</a>
          <a class="session-link" href="/team">Team</a>
          <a class="session-link" href="/alerts">Alerts</a>
          <a class="session-link" href="/">Home</a>
        </span>
      </div>
      <div class="header-inner">
        <div class="header-copy">
          <p class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#202325"/><circle cx="32" cy="32" r="26" fill="none" stroke="#ffc400" stroke-width="4"/></svg>Steel Yard Ledger</p>
          <h1>Vendors</h1>
          <p class="subtitle">Steel-yard suppliers your materials point at. Click a vendor to see the stock it supplies.</p>
        </div>
      </div>
    </header>

    <main id="app"><div class="muted" style="padding:1rem">Loading…</div></main>

    <script src="/public/vendors.js"></script>
  </body>
</html>
