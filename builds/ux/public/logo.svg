<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="Steel Yard Ledger">
  <!-- Steel Yard Ledger — full logo lockup -->
  <circle cx="48" cy="48" r="44" fill="#202325"/>
  <circle cx="48" cy="48" r="38" fill="none" stroke="#ffd84d" stroke-width="5"/>
  <!-- peak -->
