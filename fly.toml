# Fly.io deployment — Steel Yard Ledger — Alpha
#
# Deploy with:
#   fly auth login
#   fly apps create steel-yard-ledger        # once; skip if it already exists
#   fly secrets set --app steel-yard-ledger \
#       FIREBASE_SERVICE_ACCOUNT_JSON="$(cat data/firebase-service-account.json)" \
#       SESSION_SECRET="$(openssl rand -hex 48)" \
#       ADMIN_PASSWORD="<8-128 character password>"
#   fly deploy
#
# The app is stateless: Firestore holds the catalogue, users, sessions and
# uploaded images, so the machine can stop when idle and restart on demand.
# SESSION_SECRET is supplied as a Fly secret because DATA_DIR is ephemeral.

app = "steel-yard-ledger"
primary_region = "sin"         # Singapore; closest supported region to the yard

kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATA_DIR = "/data"
  # TLS terminates at Fly's edge.
  TRUST_PROXY = "true"
  COOKIE_SECURE = "true"
  CANONICAL_HOST = "steel-yard-ledger.fly.dev"
  CANONICAL_ORIGIN = "https://steel-yard-ledger.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
